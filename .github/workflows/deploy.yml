name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Also writes dist/404.html, which is how GitHub Pages serves deep links
      # on a cold load before the service worker takes over. See docs/04-RESEARCH.md §6.
      - run: npm run build
        env:
          # Not actually a secret — an OAuth client id for a browser app ships inside the
          # bundle and is public by construction. It lives in Actions secrets only so it
          # is not committed. What protects it is the Authorized JavaScript origins list
          # in Google Cloud Console. Left unset the build still succeeds and the sync
          # panel simply reports that sync is off. See docs/05-SYNC.md.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Verify Pages artefacts
        run: |
          set -e
          test -f dist/index.html    || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/404.html      || { echo "::error::dist/404.html missing (SPA deep links would 404)"; exit 1; }
          test -f dist/.nojekyll     || { echo "::error::dist/.nojekyll missing (Jekyll would drop _-prefixed chunks)"; exit 1; }
          test -f dist/sw.js         || { echo "::error::dist/sw.js missing (PWA would not install)"; exit 1; }
          grep -q '/VehicleManagement/' dist/index.html || { echo "::error::base path not applied"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
